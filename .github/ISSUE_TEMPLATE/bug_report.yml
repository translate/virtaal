name: Bug report
description: Something in Virtaal isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you do, what did you expect to happen, and what actually happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact sequence of actions that triggers it, as precisely as you can.
      placeholder: |
        1. Open checks.po
        2. ...
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Virtaal version
      description: Help → About, or run `virtaal --version`. Not sure? Leave it blank.
      placeholder: 1.0.0-rc3 (5e7cca9)
    validations:
      required: false

  - type: input
    id: install-method
    attributes:
      label: How did you install Virtaal?
      placeholder: e.g. Windows installer, macOS .dmg, Flatpak, pip install, Linux distro package
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows, macOS, Linux
    validations:
      required: false

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. Windows 11 23H2, macOS 15.1, Ubuntu 24.04
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Log output (if relevant)
      description: >
        On Windows/macOS frozen builds, `stdout_virtaal.log`/`stderr_virtaal.log`
        live next to your Virtaal config directory. Paste anything relevant -
        a real crash/traceback is far more useful here than a description of one.
      render: shell
    validations:
      required: false
