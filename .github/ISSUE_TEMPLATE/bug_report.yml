name: Bug report
description: Something in Virtaal isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you do, what did you expect to happen, and what actually happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact sequence of actions that triggers it, as precisely as you can.
      placeholder: |
        1. Open checks.po
        2. ...
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Virtaal version
      description: Help → About, or run `virtaal --version`. Not sure? Leave it blank.
      placeholder: 1.0.0 (5e7cca9)
    validations:
      required: false

  - type: input
    id: install-method
    attributes:
      label: How did you install Virtaal?
      placeholder: e.g. Windows installer, macOS .dmg, Flatpak, pip install, Linux distro package
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows, macOS, Linux
    validations:
      required: false

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. Windows 11 23H2, macOS 15.1, Ubuntu 24.04
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Log output (if relevant)
      description: |
        Only the Windows package keeps a log file. Otherwise quit Virtaal, start it again from a terminal with `--debug`, repeat the problem, and copy what the terminal shows.

        - **Windows:** Help > Show Logs, or `stdout_virtaal.log` and `stderr_virtaal.log` in `%APPDATA%\Virtaal`
        - **macOS:** `/Applications/Virtaal.app/Contents/MacOS/virtaal --debug`
        - **Flatpak:** `flatpak run io.github.translate.Virtaal --debug`
        - **AppImage:** `./Virtaal-linux-x86_64.AppImage --debug` or `./Virtaal-linux-aarch64.AppImage --debug`
        - **Linux (distribution package or source):** `virtaal --debug`

        Paste anything relevant - a real crash/traceback is far more useful here than a description of one.
      render: shell
    validations:
      required: false
