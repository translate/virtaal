name: Check LibreOffice dictionaries

# Not a pass/fail gate on every push. Virtaal's spell-check download
# feature (virtaal/support/dictionary_source.py) sources hunspell
# dictionaries directly from github.com/LibreOffice/dictionaries -
# this runs monthly to catch an upstream repo restructuring (a moved
# file, a renamed folder, a changed dictionaries.xcu shape) before a
# user's download silently fails.

on:
  schedule:
    - cron: "0 4 1 * *" # 04:00 UTC, first of the month
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install lxml

      - name: Check every dictionary folder resolves
        run: python3 devsupport/testing/check_libreoffice_dictionaries.py
        env:
          # Only virtaal.support.dictionary_source is needed here, not
          # the full app - avoids installing the whole dependency set
          # (translate-toolkit, pygobject, ...) for a lightweight
          # monthly check.
          PYTHONPATH: .
