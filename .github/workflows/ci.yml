name: Tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      debug_windows:
        description: "Open an SSH debug session (tmate) on the Windows job"
        type: boolean
        default: false

jobs:
  pre-commit:
    # Lints only the files that changed, not the whole tree - many
    # pre-existing files don't pass .pre-commit-config.yaml's hooks yet.
    # Falls back to the parent commit, then to --all-files, if there's
    # no usable diff base (first push to a branch, a force push, or a
    # repo's very first commit).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on changed files
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=""
          elif ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            # A force-push can leave github.event.before pointing at a
            # commit this checkout no longer has.
            base=""
          fi
          if [ -z "$base" ]; then
            base=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi
          if [ -z "$base" ]; then
            pre-commit run --all-files
          else
            pre-commit run --from-ref "$base" --to-ref HEAD
          fi

  docs-and-translations:
    # Own job rather than running once per matrix cell below - neither
    # step is packaging- or platform-specific.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gettext \
            intltool

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install Sphinx

      - name: Check translation catalogs
        # -c fails on real errors (mismatched printf-style placeholders,
        # msgid/msgstr newline mismatches, etc.), not just warnings.
        run: |
          status=0
          for f in po/*.po; do
            msgfmt -c -o /dev/null "$f" || status=1
          done
          exit $status

      - name: Update translations
        run: ./maketranslations

      - name: Build docs
        run: make docs

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            at-spi2-core \
            gir1.2-gtk-3.0 \
            gir1.2-gtkspell3-3.0 \
            gobject-introspection \
            hunspell-en-us \
            libcairo2-dev \
            libenchant-2-dev \
            libgirepository-2.0-dev \
            libglib2.0-dev \
            libgnutls28-dev \
            pkg-config \
            python3-dev \
            xvfb

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          # setuptools/wheel needed explicitly: "Install virtaal" below
          # uses --no-build-isolation, so pip won't provision its own
          # build backend into a throwaway env.
          pip install setuptools wheel
          # translate-toolkit has to be pre-installed, not just declared
          # as a dependency: setup.py's own top-level code imports it
          # directly (for .mo compilation), before pip has satisfied
          # pyproject.toml's declared dependencies.
          pip install translate-toolkit
          # GTK3/PyGObject aren't declared in pyproject.toml at all -
          # pip install pygobject only succeeds with GTK3 headers
          # already present, which apt provides here.
          pip install pygobject
          pip install pyenchant

      - name: Install virtaal
        # Not `python setup.py install` - unreliable about where it
        # puts the script. --no-build-isolation so setup.py's own
        # `from translate.tools.pocompile import convertmo` sees the
        # translate-toolkit installed above.
        run: |
          # shellcheck disable=SC2102  # .[test] is pip extras syntax, not a glob range
          pip install --no-build-isolation .[test]

      - name: Compile-check all Python files
        run: find . -name "*.py" -exec python -m py_compile {} +

      - name: Run tests
        run: xvfb-run -a --server-args="-screen 0 1024x768x24" pytest -rvxs virtaal

      - name: Smoke test the CLI
        run: xvfb-run -a --server-args="-screen 0 1024x768x24" virtaal --help

  test-windows:
    runs-on: windows-latest
    # Uses gvsbuild for GTK3 (prebuilt binaries a regular
    # actions/setup-python CPython can build PyGObject against via
    # MSVC), not MSYS2's own Python - MSYS2's ABI doesn't match the
    # standard wheels translate-toolkit's unicode-segmentation-rs
    # dependency ships, with no working source-build fallback either.
    #
    # Spellchecker (enchant/gtkspell3) not installed - the plugin
    # degrades gracefully without it, same as a checkout without it
    # installed locally.
    env:
      gvsbuild_version: "2026.8.0"
      # INCLUDE/LIB not set here as static values - they need to be
      # *appended to* whatever ilammy/msvc-dev-cmd computes below, not
      # replace it. See the "Add GTK3 to MSVC build environment" step.
      CC: cl
      CXX: cl
      # Forces meson (pygobject's build backend) to use MSVC - without
      # this it can pick up Strawberry Perl's gcc/ccache from PATH
      # instead (windows-latest ships it for Perl-dependent builds),
      # which doesn't consult the Windows INCLUDE env var the way
      # cl.exe does, so C:\gtk\include would be invisible to it.
      PKG_CONFIG_PATH: 'C:\gtk\lib\pkgconfig'
      # PATH (added via GITHUB_PATH, see below) covers DLL loading, but
      # `import gi`/gi.require_version() needs this separately to
      # resolve .typelib files.
      GI_TYPELIB_PATH: 'C:\gtk\lib\girepository-1.0'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Cache GTK3 (gvsbuild)
        id: cache-gtk
        uses: actions/cache@v6
        with:
          path: C:\gtk
          key: windows-gvsbuild-${{ env.gvsbuild_version }}

      - name: Download prebuilt GTK3 (gvsbuild)
        if: steps.cache-gtk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          gh release download --repo wingtk/gvsbuild "${{ env.gvsbuild_version }}" -p "GTK3_Gvsbuild_${{ env.gvsbuild_version }}_x64.zip"
          7z x "GTK3_Gvsbuild_${{ env.gvsbuild_version }}_x64.zip" -oC:\gtk -y
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Add GTK3 to PATH
        # Not a job-level `env: PATH:` entry - that would *replace* the
        # runner's whole PATH for every step (including this one's own
        # git/python/pwsh), not append to it. GITHUB_PATH is the correct
        # mechanism: prepends for every step from here on, additively.
        shell: pwsh
        run: echo "C:\gtk\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up MSVC build environment
        # windows-latest has the MSVC toolchain (cl.exe) installed but
        # not on PATH/INCLUDE/LIB by default - runs the equivalent of
        # vcvarsall.bat and persists the result for every later step.
        uses: ilammy/msvc-dev-cmd@v1

      - name: Add GTK3 to MSVC build environment
        # Must run *after* msvc-dev-cmd, appending to its INCLUDE/LIB
        # rather than replacing them - cl.exe needs its own CRT/Windows
        # SDK headers/libs (from msvc-dev-cmd) *and* GTK3's (from
        # gvsbuild) at once.
        shell: pwsh
        run: |
          echo "INCLUDE=$env:INCLUDE;C:\gtk\include;C:\gtk\include\cairo;C:\gtk\include\glib-2.0;C:\gtk\include\gobject-introspection-1.0;C:\gtk\lib\glib-2.0\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "LIB=$env:LIB;C:\gtk\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Restore PKG_CONFIG_PATH after setup-python
        # actions/setup-python overwrites PKG_CONFIG_PATH via
        # $GITHUB_ENV during setup, clobbering the job-level value above
        # for every later step - without this, pip install pygobject's
        # meson build loses pkg-config's ability to find glib/gobject-
        # introspection/gtk3's .pc files.
        shell: pwsh
        run: echo "PKG_CONFIG_PATH=C:\gtk\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure GTK3 DLLs are found by Python's extension loader
        # Python 3.8+ no longer searches PATH for an extension module's
        # own dependent DLLs - a sitecustomize.py (auto-imported at
        # interpreter startup) is the standard fix, covering every
        # later step in the job without touching virtaal's own source.
        shell: pwsh
        run: |
          $sitepkgs = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          $content = "import os`nif os.name == 'nt':`n    os.add_dll_directory(r'C:\gtk\bin')`n"
          Set-Content -Path "$sitepkgs\sitecustomize.py" -Value $content -NoNewline

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install setuptools wheel
          pip install pycairo
          pip install pygobject
          pip install translate-toolkit
          pip install python-Levenshtein
          pip install pycurl
          pip install lxml
          pip install diff_match_patch
          pip install cheroot
          pip install pytest

      - name: Install virtaal
        run: pip install --no-build-isolation .

      - name: Compile-check all Python files
        run: |
          Get-ChildItem -Recurse -Filter *.py | ForEach-Object { python -m py_compile $_.FullName }

      - name: Smoke test the GTK3 import
        # Cheap, fast canary isolating GTK3 DLL/typelib loading from
        # pytest and virtaal's own code - the first real
        # `from gi.repository import Gtk` in the whole job.
        run: |
          python -c "import gi; gi.require_version('Gtk', '3.0'); from gi.repository import Gtk; print('GTK', Gtk.get_major_version(), Gtk.get_minor_version(), Gtk.get_micro_version())"
        env:
          PYTHONFAULTHANDLER: "1"

      - name: Debug via tmate (manual trigger only)
        # Opens an interactive SSH session into this runner - only when
        # manually dispatched with debug_windows=true, never on a
        # normal push/PR.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_windows }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30

      - name: Run tests
        # No xvfb-run equivalent needed - Windows always has its own
        # native windowing system available, even in a non-interactive
        # CI session, unlike X11.
        run: pytest -rvxs virtaal
        env:
          PYTHONFAULTHANDLER: "1"

      - name: Smoke test the CLI
        run: virtaal --help

  build-windows-installer:
    runs-on: windows-latest
    needs: test-windows
    # Separate job from test-windows, not extra steps tacked onto it -
    # PyInstaller has to trace and copy the whole dependency tree,
    # which is genuinely slow, and this only needs to run once the
    # fast pytest job has already confirmed the app itself works.
    env:
      gvsbuild_version: "2026.8.0"
      CC: cl
      CXX: cl
      PKG_CONFIG_PATH: 'C:\gtk\lib\pkgconfig'
      GI_TYPELIB_PATH: 'C:\gtk\lib\girepository-1.0'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Same GTK3/MSVC/DLL-loading setup as test-windows - see that job's
      # own step comments for the reasoning behind each one. PyInstaller
      # needs a real, working GTK3/PyGObject environment to trace and
      # bundle, not just virtaal's own pure-Python dependencies.
      - name: Cache GTK3 (gvsbuild)
        id: cache-gtk
        uses: actions/cache@v6
        with:
          path: C:\gtk
          key: windows-gvsbuild-${{ env.gvsbuild_version }}

      - name: Download prebuilt GTK3 (gvsbuild)
        if: steps.cache-gtk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          gh release download --repo wingtk/gvsbuild "${{ env.gvsbuild_version }}" -p "GTK3_Gvsbuild_${{ env.gvsbuild_version }}_x64.zip"
          7z x "GTK3_Gvsbuild_${{ env.gvsbuild_version }}_x64.zip" -oC:\gtk -y
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Add GTK3 to PATH
        shell: pwsh
        run: echo "C:\gtk\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Add GTK3 to MSVC build environment
        shell: pwsh
        run: |
          echo "INCLUDE=$env:INCLUDE;C:\gtk\include;C:\gtk\include\cairo;C:\gtk\include\glib-2.0;C:\gtk\include\gobject-introspection-1.0;C:\gtk\lib\glib-2.0\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "LIB=$env:LIB;C:\gtk\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Restore PKG_CONFIG_PATH after setup-python
        shell: pwsh
        run: echo "PKG_CONFIG_PATH=C:\gtk\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure GTK3 DLLs are found by Python's extension loader
        shell: pwsh
        run: |
          $sitepkgs = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          $content = "import os`nif os.name == 'nt':`n    os.add_dll_directory(r'C:\gtk\bin')`n"
          Set-Content -Path "$sitepkgs\sitecustomize.py" -Value $content -NoNewline

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install setuptools wheel
          pip install pycairo
          pip install pygobject
          pip install translate-toolkit
          pip install python-Levenshtein
          pip install pycurl
          pip install lxml
          pip install diff_match_patch
          pip install cheroot
          pip install pyinstaller

      - name: Install virtaal
        run: pip install --no-build-isolation .

      - name: Build self-contained bundle
        shell: pwsh
        run: devsupport\packaging\windows\build_standalone.ps1

      - name: Verify the bundle actually runs
        # Launch with a real file in the background, confirm the
        # process is still *alive* after enough time for GTK/plugin
        # init, then kill it - a windowed-subsystem (console=False) GUI
        # app never exits on its own, so waiting for an exit code isn't
        # the right shape of check here. The log-content allowlist
        # starts empty; add a regex to it if/when a genuinely benign
        # line shows up.
        shell: pwsh
        run: |
          . .\devsupport\testing\windows\virtaal_ui_test_helpers.ps1
          $t = Start-VirtaalTest -Arguments "devsupport\testfiles\checks.po"
          if (-not $t) { exit 1 }
          Stop-VirtaalTest $t
          Write-VirtaalLogs
          if (-not (Assert-VirtaalLogsClean)) { exit 1 }

      - name: Verify repeated navigation doesn't grow the window
        # Regression check: opening a file and repeatedly pressing
        # Enter to advance units used to grow the window a little wider
        # each time with no shrink-back - any file with more than
        # ~20-30 strings ended up unusably wide. Different trigger than
        # the step above (which never navigates between units) -
        # storetreeview.py's select_index().
        shell: pwsh
        run: |
          . .\devsupport\testing\windows\virtaal_ui_test_helpers.ps1
          $t = Start-VirtaalTest -Arguments "po\af.po"
          if (-not $t) { exit 1 }

          $widthBefore = Get-VirtaalWidth $t
          Write-Host "Window width before navigation: $widthBefore"

          for ($i = 0; $i -lt 25; $i++) {
              Send-VirtaalKeys $t "{ENTER}"
          }

          $widthAfter = Get-VirtaalWidth $t
          Write-Host "Window width after 25x Enter-to-advance: $widthAfter"
          Stop-VirtaalTest $t

          $growth = $widthAfter - $widthBefore
          Write-Host "Width growth after 25 navigations: $growth px"
          if ($growth -gt 50) {
              Write-Host "::error::Window grew by $growth px after 25x Enter-to-advance - see storetreeview.py's select_index()"
              Write-VirtaalLogs
              exit 1
          }

      - name: Verify common keyboard shortcuts don't crash the app
        # Exercises Ctrl+Z (undo), Ctrl+X/C/V (cut/copy/paste), and
        # Ctrl+O (File > Open) - not a functional check of what each
        # shortcut does, just that sending them doesn't crash or hang
        # the app.
        shell: pwsh
        run: |
          . .\devsupport\testing\windows\virtaal_ui_test_helpers.ps1
          $t = Start-VirtaalTest -Arguments "devsupport\testfiles\checks.po"
          if (-not $t) { exit 1 }

          foreach ($keys in @("^z", "^x", "^c", "^v")) {
              Send-VirtaalKeys $t $keys
          }
          # Ctrl+O opens the file-open dialog - a real modal window that
          # would otherwise block indefinitely waiting for input, so
          # close it with Escape immediately rather than leaving it open
          # for the rest of the job.
          Send-VirtaalKeys $t "^o"
          Send-VirtaalKeys $t "{ESC}"

          $stillAlive = Get-Process -Id $t.Process.Id -ErrorAction SilentlyContinue
          Stop-VirtaalTest $t

          if (-not $stillAlive) {
              Write-Host "::error::Bundle crashed after sending Ctrl+Z/X/C/V/O"
              Write-VirtaalLogs
              exit 1
          }
          if (-not (Assert-VirtaalLogsClean)) { exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: Virtaal-windows-bundle
          path: dist\virtaal
          if-no-files-found: error

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: devsupport\packaging\windows\build_installer.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: Virtaal-windows-installer
          path: dist\installer\*.exe
          if-no-files-found: error

  test-macos:
    runs-on: macos-latest
    # Single Python version (whatever Homebrew currently ships), not the
    # 3.10-3.14 matrix the Linux job runs: unlike apt, Homebrew doesn't
    # provide an easy way to build PyGObject against several Python
    # versions at once, and this job's whole approach hinges on using
    # Homebrew's own Python (see the venv step below) rather than
    # actions/setup-python's.
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install system dependencies (Homebrew)
        # pygobject3/gtk+3 for the app itself, gtk-mac-integration for
        # native macOS menu-bar support, enchant/gtkspell3 for the
        # spellchecker plugin. gobject-introspection/cairo/pkg-config/
        # gettext are build-time needs `pip install pygobject` depends
        # on that apt provides directly on the Linux job but Homebrew
        # splits into separate formulae.
        run: |
          # GitHub's macos-latest image comes with aws/tap pre-tapped but
          # untrusted, which prints an "untrusted tap" warning on every
          # `brew install` even though we never use it - untap it (not
          # HOMEBREW_NO_REQUIRE_TAP_TRUST, which Homebrew's own message
          # says is being removed) since nothing here needs it.
          brew untap aws/tap || true
          brew install pygobject3 gtk+3 gtk-mac-integration \
            gobject-introspection cairo pkg-config gettext \
            enchant gtkspell3

      - name: Create venv with system site-packages
        # --system-site-packages so this venv's Python can see Homebrew's
        # compiled `gi` module - a plain venv can't see it at all.
        # Appending to GITHUB_PATH (rather than
        # `source .venv/bin/activate`, which only affects the shell it
        # runs in) makes every later step in this job use the venv
        # automatically.
        run: |
          python3 -m venv --system-site-packages .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install setuptools wheel
          # Pre-installed for the same reason as the Linux job: setup.py
          # imports it directly at the top level, before pyproject.toml's
          # declared dependencies get a chance to be satisfied. GTK3/
          # PyGObject need no separate pip install here (unlike Linux) -
          # the --system-site-packages venv above already sees Homebrew's
          # brew-installed `gi` module directly.
          pip install translate-toolkit
          pip install pyenchant

      - name: Install virtaal
        # .[test] pulls in pyproject.toml's declared dependencies
        # (pycurl, lxml, diff_match_patch, python-Levenshtein, cheroot)
        # plus pytest, in one step instead of eight separate ones.
        run: pip install --no-build-isolation .[test]

      - name: Compile-check all Python files
        run: find . -name "*.py" -exec python -m py_compile {} +

      - name: Run tests
        # No xvfb-run equivalent: macOS's WindowServer is a real system
        # daemon that's always running, even in CI, unlike X11 which has
        # no display server at all without one.
        run: pytest -rvxs virtaal

      - name: Smoke test the CLI
        run: virtaal --help

  build-macos-app:
    needs: test-macos
    # Separate job from test-macos, not extra steps tacked onto it:
    # PyInstaller has to trace and copy the whole dependency tree, which
    # is genuinely slow, and this only needs to run once the fast pytest
    # job has already confirmed the app itself works - no point spending
    # the extra time building a bundle around a broken app.
    #
    # Two-leg matrix, not a single macos-latest job: PyInstaller builds
    # a single-architecture bundle matching the host it runs on, and
    # Homebrew doesn't ship universal2 GTK3 bottles, so an arm64-only
    # build won't run on an Intel Mac at all (Rosetta 2 only
    # translates x86_64 -> arm64, not the reverse). A real universal2
    # bundle isn't attempted - every dependency would need to be built
    # as a fat binary from source, which Homebrew doesn't support -
    # building both architectures separately is the practical fix.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Same Homebrew/venv setup as test-macos - PyInstaller needs a real,
      # working GTK3/PyGObject environment to trace and bundle, not just
      # virtaal's own pure-Python dependencies.
      - name: Install system dependencies (Homebrew)
        run: |
          brew untap aws/tap || true
          brew install pygobject3 gtk+3 gtk-mac-integration \
            gobject-introspection cairo pkg-config gettext \
            enchant gtkspell3

      - name: Create venv with system site-packages
        run: |
          python3 -m venv --system-site-packages .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install setuptools wheel
          pip install translate-toolkit
          pip install pyenchant
          pip install pyinstaller

      - name: Install virtaal
        run: pip install --no-build-isolation .

      - name: Build self-contained .app bundle
        run: devsupport/packaging/macos/build_standalone.sh

      - name: Verify the bundle launches cleanly
        # Launch with a real file in the background, confirm the process
        # is still alive after enough time for GTK/plugin init, and
        # confirm the log is clean - empty, not just "didn't crash".
        # enchant is deliberately excluded from this bundle (see
        # virtaal.spec's comment) so "Failed to load plugin
        # spellchecker"-type lines are expected and fine; anything else
        # in the log is not.
        run: |
          dist/Virtaal.app/Contents/MacOS/virtaal devsupport/testfiles/checks.po > /tmp/bundle-launch.log 2>&1 &
          PID=$!
          sleep 6
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::Bundle exited within 6s of launch"
            cat /tmp/bundle-launch.log
            exit 1
          fi
          kill "$PID"
          pkill -f virtaal.support.tmserver || true
          if grep -Eqv "spellchecker|enchant|GtkosxApplication" /tmp/bundle-launch.log; then
            echo "::error::Unexpected output in the bundle's log"
            cat /tmp/bundle-launch.log
            exit 1
          fi

      - name: Package the bundle for upload
        # Pointing upload-artifact straight at the dist/Virtaal.app
        # *directory* lets its own zip/re-serve pipeline mangle the
        # bundle - the code signature (embedded in
        # Contents/_CodeSignature, hashes every file's exact
        # bytes/permissions) comes out invalid on download, which macOS
        # reports as "Virtaal.app is damaged and can't be opened" -
        # persists even after clearing the quarantine flag, since it's a
        # broken signature, not a quarantine block. `ditto` is Apple's
        # own tool for archiving app bundles for exactly this reason -
        # unlike a plain zip/tar, it's bundle-aware and preserves the
        # signature, symlinks (including Contents/MacOS/share), and
        # extended attributes faithfully.
        run: ditto -c -k --sequesterRsrc --keepParent dist/Virtaal.app dist/Virtaal-macos-app.zip

      - name: Verify the signature survives the archive step
        # Cheap, immediate check that the fix above actually works -
        # unzip with ditto (not plain unzip - same bundle-aware reasoning
        # as packaging) and re-check codesign right here.
        run: |
          ditto -x -k dist/Virtaal-macos-app.zip /tmp/verify-signature
          codesign -dv --verbose=4 /tmp/verify-signature/Virtaal.app

      - uses: actions/upload-artifact@v7
        with:
          name: Virtaal-macos-app-${{ matrix.arch }}
          path: dist/Virtaal-macos-app.zip
          if-no-files-found: error

      - name: Build .dmg installer
        run: devsupport/packaging/macos/build_dmg.sh

      - name: Verify the .dmg mounts and contains a real app
        # A .dmg is a single opaque file, unlike the raw .app directory
        # above - no ditto-style archiving trick needed for the artifact
        # upload itself, but still worth confirming the disk image is
        # genuinely mountable and has what it should before shipping it
        # as a build artifact, rather than assuming dmgbuild succeeding
        # silently means the result is actually usable.
        run: |
          hdiutil attach dist/Virtaal.dmg -mountpoint /tmp/verify-dmg -nobrowse -quiet
          test -x /tmp/verify-dmg/Virtaal.app/Contents/MacOS/virtaal
          test -L /tmp/verify-dmg/Applications
          hdiutil detach /tmp/verify-dmg -quiet

      - uses: actions/upload-artifact@v7
        with:
          name: Virtaal-macos-dmg-${{ matrix.arch }}
          path: dist/Virtaal.dmg
          if-no-files-found: error

  build-flatpak:
    # flatpak-builder is Linux-only - this is the only place the
    # manifest gets built and smoke-tested.
    #
    # Two-leg matrix, not a single ubuntu-24.04 job: flatpak-builder
    # (like PyInstaller for the macOS build above) builds for whatever
    # architecture it runs on - unlike that case, though, both a real
    # hosted aarch64 runner (ubuntu-24.04-arm) and an aarch64 GNOME
    # runtime on Flathub already exist, so this is a plain CI-config
    # addition, not blocked on anything upstream.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder gettext intltool xvfb
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build translated .desktop/.metainfo.xml
        run: ./maketranslations

      - name: Install the GNOME runtime/SDK
        run: |
          flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Build the Flatpak
        working-directory: devsupport/packaging/flatpak
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --repo=repo build-dir io.github.translate.Virtaal.yml

      - name: Smoke test - the built app actually runs
        working-directory: devsupport/packaging/flatpak
        # No display server on this runner - same headless gap the
        # Linux `test` job's own `xvfb-run` step already solves.
        run: |
          xvfb-run -a --server-args="-screen 0 1024x768x24" \
            flatpak-builder --run build-dir io.github.translate.Virtaal.yml \
            virtaal --version

  core-checks:
    name: core checks
    needs: [pre-commit, docs-and-translations]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more required jobs did not succeed."
            exit 1
          fi
