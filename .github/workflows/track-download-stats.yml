name: Track release download stats

# GitHub only exposes a running-total download_count per release asset,
# with no history endpoint - so the only way to see a trend over time is
# to snapshot it ourselves. Commits straight to the download-stats branch
# rather than main, since main is behind a merge-queue ruleset and a
# daily one-line CSV append doesn't warrant a PR per run.

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Switch to (or create) the download-stats branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin download-stats >/dev/null 2>&1; then
            git fetch origin download-stats
            git checkout download-stats
          else
            git checkout --orphan download-stats
            git rm -rf . >/dev/null
          fi

      - name: Append today's download counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          csv=download-stats.csv
          [ -f "$csv" ] || echo "date,tag,asset,downloads" > "$csv"
          today=$(date -u +%F)
          gh api "repos/${{ github.repository }}/releases" --paginate \
            -q '.[] | .tag_name as $tag | .assets[] | [$tag, .name, .download_count] | @csv' \
            | sed "s/^/${today},/" >> "$csv"

      - name: Commit and push if changed
        run: |
          git add download-stats.csv
          git diff --cached --quiet && exit 0
          git commit -m "Snapshot release download stats for $(date -u +%F)"
          git push origin download-stats
