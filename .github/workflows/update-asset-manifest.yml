name: Update asset manifest

# Not a pass/fail gate on every push. Virtaal's downloadable-asset
# support (spell-check dictionaries, thesauruses, autocorrect data -
# see virtaal/support/asset_manifest.py) sources everything directly
# from LibreOffice's own dictionaries and core repos - this runs weekly
# to catch an upstream repo restructuring (a moved file, a renamed
# folder, a changed dictionaries.xcu shape) before a user's download
# silently fails, and, on a clean run, publishes the manifest
# asset_manifest.py fetches at runtime instead of doing this same
# discovery live.

on:
  schedule:
    - cron: "0 4 * * 1" # 04:00 UTC, every Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install lxml PyYAML

      - name: Validate every asset folder and generate the manifest
        run: |
          python3 devsupport/testing/generate_asset_manifest.py --manifest-out "${RUNNER_TEMP}/asset-manifest.yaml"
        env:
          # Only virtaal.support.dictionary_source is needed here, not
          # the full app - avoids installing the whole dependency set
          # (translate-toolkit, pygobject, ...) for a lightweight
          # weekly check.
          PYTHONPATH: .

      - uses: actions/upload-artifact@v7
        with:
          name: asset-manifest
          path: ${{ runner.temp }}/asset-manifest.yaml

  publish:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: asset-manifest
          path: ${{ runner.temp }}

      - name: Switch to (or create) the asset-manifest branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin asset-manifest >/dev/null 2>&1; then
            git fetch origin asset-manifest
            git checkout asset-manifest
          else
            git checkout --orphan asset-manifest
            git rm -rf . >/dev/null
          fi

      - name: Commit and push if changed
        env:
          MANIFEST_PATH: ${{ runner.temp }}/asset-manifest.yaml
        run: |
          cp "$MANIFEST_PATH" asset-manifest.yaml
          git add asset-manifest.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Update asset manifest for $(date -u +%F)"
          git push origin asset-manifest
