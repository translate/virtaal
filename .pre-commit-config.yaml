# See docs/development.rst for setup instructions.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.pot?$
      - id: end-of-file-fixer
        exclude: \.pot?$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-ast
      - id: debug-statements
        # devsupport/debugging.py's whole purpose is a decorator that
        # intentionally drops into pdb - not an accidental leftover.
        exclude: ^devsupport/debugging\.py$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: check-pot-freshness
        name: check po/virtaal.pot is up to date with translatable sources
        entry: po/check-pot-freshness.sh
        language: system
        pass_filenames: true
