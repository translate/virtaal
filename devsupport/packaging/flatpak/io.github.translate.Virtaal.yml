id: io.github.translate.Virtaal
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: virtaal

finish-args:
  # No --filesystem=host: Gtk.FileChooserDialog already works through
  # the portal-provided file picker inside a sandbox.
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # TM/terminology plugins do real HTTP lookups.
  - --share=network

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/man
  - "*.la"
  - "*.a"

modules:
  # Generated via flatpak-builder-tools' flatpak-pip-generator against
  # this repo's pyproject.toml.
  - virtaal-python-deps.yaml

  # Spell checking while typing; the runtime has enchant but not
  # gtkspell3.
  - name: gtkspell3
    config-opts:
      - --disable-documentation
    modules:
      # Build-time only; from flathub/shared-modules.
      - name: intltool
        cleanup:
          - "*"
        sources:
          - type: archive
            url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
            sha256: 67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd
          - type: patch
            path: intltool-perl5.26-regex-fixes.patch
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/gtkspell/gtkspell3-3.0.10.tar.xz
        sha256: b040f63836b347eb344f5542443dc254621805072f7141d49c067ecb5a375732

  - name: virtaal
    buildsystem: simple
    build-commands:
      # --no-build-isolation: the sandbox has no network, so pip can't
      # provision [build-system].requires; it uses the setuptools and
      # translate-toolkit already in the build env instead.
      - pip3 install --verbose --exists-action=i --no-build-isolation
        --prefix=${FLATPAK_DEST} .
      # Two calls, not one: the mimetype package keeps the plain
      # "virtaal" target name, while the desktop file and metainfo are
      # already named after the app id in the source tree. flatpak only
      # exports a mimetype package named after the app id.
      - ./maketranslations
      - ./maketranslations io.github.translate.Virtaal
      - install -Dm644 share/applications/io.github.translate.Virtaal.desktop
        ${FLATPAK_DEST}/share/applications/io.github.translate.Virtaal.desktop
      - install -Dm644 share/metainfo/io.github.translate.Virtaal.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/io.github.translate.Virtaal.metainfo.xml
      - install -Dm644 share/mime/packages/virtaal-mimetype.xml
        ${FLATPAK_DEST}/share/mime/packages/io.github.translate.Virtaal.xml
    sources:
      - type: dir
        path: ../../..
