{# The theme's search page hides its "JavaScript Disabled" warning with
   jQuery, which Sphinx no longer ships: show it only in <noscript>. #}
{% extends "!search.html" %}
{% block body %}
  <h1 id="search-documentation">{{ _('Search') }}</h1>
  <noscript>
  <div id="fallback" class="admonition warning">
    <p class="admonition-title">{% trans %}JavaScript Disabled{% endtrans %}</p>
    <p>
      {% trans %}Please activate JavaScript to enable the search
      functionality.{% endtrans %}
    </p>
  </div>
  </noscript>
  <p>
    {% trans %}From here you can search these documents. Enter your search
    words into the box below and click "search". Note that the search
    function will automatically search for all of the words. Pages
    containing fewer words won't appear in the result list.{% endtrans %}
  </p>
  <form action="" method="get">
    <div class="input-append">
      <input type="text" name="q" value="" />
      <button class="btn" type="submit"><i class="icon-search"
          style="line-height: 1.4;"></i></button>
    </div>
    <span id="search-progress" style="padding-left: 10px"></span>
  </form>
  <div id="search-results"></div>
{% endblock %}
