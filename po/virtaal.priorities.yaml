    - 'In this message the proper way of translating plurals are seen. You need to enter between 1 and 6 different versions of the translation to ensure the correct grammar in your language. Read more about this here: http://docs.translatehouse.org/projects/localization-guide/en/latest/guide/translation/plurals.html'
