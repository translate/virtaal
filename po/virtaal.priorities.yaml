    - 'In this message, "%d" refers again to the number of files, but note how the "(s)" is used to show that we don''t know how many it will be. This is often hard to translate well. If you encounter this in software translation, you might want to hear from developers if this can be avoided. Read more about this and decide how to do it in your language: http://docs.translatehouse.org/projects/localization-guide/en/latest/guide/translation/plurals.html'
