[build-system]
# setup.py compiles the .mo files with translate-toolkit.
requires = ["setuptools>=68", "translate-toolkit>=3.17.5"]
build-backend = "setuptools.build_meta"

[project]
name = "virtaal"
dynamic = ["version"]
description = "A tool to create program translations."
readme = "README.rst"
license = "GPL-2.0-or-later"
authors = [
    {name = "Translate"},
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python",
    "Topic :: Software Development :: Localization",
    "Topic :: Text Processing :: Linguistic",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
]
# GTK3/PyGObject deliberately NOT listed here: `pip install pygobject`
# only succeeds if GTK3's own headers/libs are already present on the
# system, which varies wildly by platform (apt/Homebrew/gvsbuild) - see
# each CI job and .claude/skills/run-virtaal/SKILL.md's prerequisites.
# It's a documented system prerequisite, not a normal pip dependency,
# same reason most GTK Python projects don't declare it either.
dependencies = [
    # translate-toolkit 3.18.0+ dropped Python 3.10 support - this
    # project's own requires-python floor - so a single pin can't cover
    # the whole matrix; last 3.10-compatible release pinned there,
    # latest pinned everywhere else, same as pip's own unpinned
    # resolution already did per-interpreter before this was pinned.
    "translate-toolkit==3.17.5; python_version < '3.11'",
    "translate-toolkit==3.20.0; python_version >= '3.11'",
    # translate-toolkit gates Fluent (.ftl) support behind its own
    # "fluent" extra rather than a plain dependency - without this,
    # translate.storage.factory still lists "Fluent file" in the
    # supported-formats list (and Virtaal's Open dialog offers it),
    # but actually opening one raises ModuleNotFoundError.
    "fluent.syntax==0.19.0",
    "pycurl==7.48.0",
    # pycurl's own wheel bundles no CA bundle to verify against - see
    # httpclient.py's own _configure_ca_bundle().
    "certifi==2026.7.22",
    "diff_match_patch==20241021",
    # translate-toolkit 3.17.5 (the python_version < '3.11' pin above)
    # itself constrains lxml to <6.1 - a real cross-package conflict,
    # not just an availability gap, so this needs the same split.
    "lxml==6.0.4; python_version < '3.11'",
    "lxml==6.1.3; python_version >= '3.11'",
    # Same story as translate-toolkit above: python-Levenshtein's own
    # Levenshtein engine dependency dropped Python 3.10 support at
    # 0.27.5 (0.27.4 still supports it) - python-Levenshtein's own
    # metadata alone doesn't show this, only its unpinned transitive
    # Levenshtein dependency does.
    "python-Levenshtein==0.27.4; python_version < '3.11'",
    "python-Levenshtein==0.27.5; python_version >= '3.11'",
    "cheroot==11.1.2",
    "bottle==0.13.4",
    # translate-toolkit's tr_lang() (language-pair labels, font preview
    # text) prefers pycountry's bundled locale data over the system
    # iso-codes package - without it, those names silently fall back to
    # English wherever the OS doesn't happen to have iso-codes installed.
    "pycountry==26.2.16",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
spellcheck = ["pyenchant==3.3.0"]
test = ["pytest==9.1.1", "pytest-cov==7.1.0", "pytest-xdist==3.8.0", "pytest-timeout==2.4.0", "pytest-rerunfailures==16.7"]
docs = ["Sphinx==9.1.0"]
# Not wired into pre-commit or CI - GTK/GI stub coverage isn't good
# enough yet for a repo-wide rollout.
type-check = ["ty==0.0.84"]

[project.urls]
Homepage = "https://virtaal.translatehouse.org"
Repository = "https://github.com/translate/virtaal"

[tool.setuptools]
script-files = ["bin/virtaal"]
# bin/virtaal stays a real script file (not a console_scripts entry
# point): it has its own dependency-check-then-launch logic keyed off
# `sys.argv`/`__file__` that a thin entry-point wrapper would need to
# preserve carefully - a bigger, separate refactor, not part of this
# packaging cleanup.

[tool.pytest.ini_options]
# A hung test used to consume a whole CI job's 10-minute budget with no
# indication of which test or where - timeout-method=thread dumps every
# thread's stack (faulthandler) before failing just that one test, so a
# hang becomes a normal, located failure instead of a silent timeout.
timeout = 30
timeout_method = "thread"
# PyGObject's own internal deprecation warnings (not from virtaal's own
# code) can crash a pytest-xdist worker outright when reported back to
# the master process - unserialize_warning_message()'s getattr(mod,
# class_name) hits gi/__init__.py's deliberate guard against the old
# `import gobject` pattern, mistaking a warning's own module for that.
# Filtering them here means they're never captured for cross-worker
# reporting at all - PR #3817 fixed one instance of this same
# INTERNALERROR class (a different warning); these are pre-existing,
# unrelated warnings that can hit the identical vulnerability.
filterwarnings = [
    "ignore:GLib.unix_signal_add_full is deprecated:Warning",
    "ignore:.*AbstractEventLoopPolicy.*:Warning",
    "ignore:.*get_event_loop_policy.*:Warning",
]

[tool.setuptools.dynamic]
version = {attr = "virtaal.__version__.ver"}

[tool.setuptools.packages.find]
include = ["virtaal*"]
exclude = ["virtaal.test"]
# virtaal.test has no __init__.py (not a real package - pytest doesn't
# need one for discovery), so it's excluded here rather than shipped.
# devsupport* is excluded implicitly by only including virtaal* at all -
# it never was packaged for a real install, only usable from a source
# checkout (see virtaal/cli.py's profiling support, which already degrades
# gracefully when devsupport.profiling isn't importable).

# gettext.install('virtaal') (pan_app.py) puts `_` into builtins at
# runtime - invisible to static analysis, so every translatable
# string would otherwise flag as F821.
[tool.ruff]
builtins = ["_"]

[tool.ruff.lint]
# F (pyflakes: unused imports/variables, undefined names), UP
# (pyupgrade: obsolete py2-compat patterns like super(Cls, self)), and
# I (isort: import sorting/grouping). Deliberately not the default
# style/whitespace rule families - that's ruff format's job, not
# enabled yet.
select = ["F", "I", "UP"]
ignore = [
    # %-format -> f-string: 198 sites, needs real per-call
    # verification (escaping/argument-shape can change), not a
    # mechanical rename - same "known, not fixed yet" treatment as
    # devsupport/known-deprecation-warnings.txt.
    "UP031",
    # unused-variable: 42 sites, needs per-site judgement (some are
    # genuinely dead, some computed for a side effect) rather than a
    # blind removal.
    "F841",
]

[tool.coverage.run]
# Dev tooling that only ever runs by a developer invoking it directly
# (a manual-test script, a fake backend for eyeballing UI, a plugin
# template to copy) - not reachable application logic, so it can never
# meaningfully be unit tested. Left in and counted, they permanently
# drag the real coverage figure down instead of reflecting it.
omit = [
    "virtaal/plugins/_helloworld.py",
    "virtaal/plugins/_ipython_console/__init__.py",
    "virtaal/plugins/_ipython_console/ipython_view.py",
    "virtaal/plugins/_python_console.py",
    "virtaal/plugins/tm/models/_dummytm.py",
    "virtaal/views/widgets/demo_cellrendererwidget.py",
    "virtaal/views/widgets/demo_selectdialog.py",
    "virtaal/views/widgets/demo_selectview.py",
    "virtaal/views/widgets/demo_textbox.py",
]

[tool.coverage.report]
# Ratchets up over time as real tests get added - a couple points
# below the lowest per-platform figure (macOS, which skips more GTK
# tests), so an incidental single-line drop on an unrelated PR doesn't
# fail CI on its own.
fail_under = 87

[tool.codespell]
skip = "*.po,*.pot,po/*,ChangeLog,build,dist,*.egg-info,docs/_themes,devsupport/testfiles,.git,virtaal/support/test_statsdb_ported.py,devsupport/packaging/windows/languages/*"
# test_statsdb_ported.py: verbatim French/Afrikaans PO fixture content
# ported from translate-toolkit's own test suite, same reasoning as
# skipping *.po/*.pot themselves. devsupport/packaging/windows/languages/:
# vendored non-English Inno Setup installer translations, same reasoning
# again.
# datas: PyInstaller's own datas= kwarg, not a typo. gir: GObject
# Introspection Repository (.gir) files, not "git". abd: "Alaa Abd El
# Fattah" (a real name, aboutdialog.py). bable: "Bable", Asturian's
# own alternate ISO language name (translate_compat.py). inout: a
# deliberate (if terse) variable name for a stream used as stdin/
# stdout/stderr together (openmailto.py), not a typo of "input". afile:
# translate-toolkit's own parameter/variable name throughout the
# vendored bundleprojstore.py/projstore.py, not a typo of "a file".
ignore-words-list = "datas,gir,abd,bable,inout,afile"
